# OpenRouter (OpenAI-compatible POST /chat/completions). The key is read from the environment variable named by
# api_key_env and never written anywhere. Per-agent models: world.agent_providers=[{model: ...}, ...].
name: openrouter
model: openai/gpt-oss-120b
temperature: 1
top_p: 0.5
timeout: 120
max_retries: 4
api_key_env: OPENROUTER_API_KEY
base_url: null         # null: https://openrouter.ai/api/v1
max_tokens: 4000       # reply length cap per call; reasoning models count their reasoning against it
max_backoff_s: 60      # longest wait between retries (Retry-After is honoured up to this)
extra_body: {}         # extra request fields for this provider, on the command line: +provider.extra_body.reasoning.effort=low
drop_unsupported_params: true   # leave out temperature/top_p/seed when the model does not accept them (logged per attempt as dropped_params)
