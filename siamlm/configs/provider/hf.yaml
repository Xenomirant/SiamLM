# A local Hugging Face causal LM through transformers (siamlm/providers/hf.py; pip install "siamlm[hf]"). The chat
# template must take a system role and tools (Qwen2.5/Qwen3, Llama-3.1+, Hermes-style <tool_call> output). On CPU use
# a small model, e.g. Qwen/Qwen2.5-0.5B-Instruct, and a small provider.max_tokens.
name: hf
model: Qwen/Qwen2.5-0.5B-Instruct
device: cpu
dtype: float32
temperature: 0.7
top_p: 0.9
timeout: 600
max_retries: 0
cache: prefix        # KV-cache reuse across this agent's calls (siamlm/providers/kvcache.py).
                     # prefix (default): the longest common prefix with the previous prompt keeps its cache; exact, the
                     #   same request and the same states. none: prefill the whole prompt every call (an opt-out: no
                     #   cache resident per agent, for memory or debugging; unsupported models and steering fall back
                     #   to it by themselves).
                     # span: Suffix Cache Reuse after Context Language Models: every surviving span keeps its cache,
                     #   moved to its new position; only inserted tokens are prefilled. SURVIVORS CARRY STATES COMPUTED
                     #   WHILE THE DELETED OR REWRITTEN TEXT WAS STILL THERE: a wiped turn keeps influencing the model
                     #   through them, so the context file is no longer the only state. Not for the wiping and
                     #   state-binding studies; a tool for the question of leftover traces (and for throughput).
                     # Each call reports cache_* in its usage
cache_min_span: 16   # span: survivors shorter than this are prefilled
cache_max_spans: 6   # span: at most this many survivors relocated per call (the longest first)
# steer: EXPERIMENTAL (siamlm/capabilities/steer.py, docs/steering.md; pip install "siamlm[steer]"). The vectors'
# settings (concepts, vectors_dir, layer, extract_questions) for any steering of this agent; `enabled: true` is the
# older per-agent switch for self-steering with the behaviour settings below (= capabilities.steer.self for this agent;
# the capabilities.steer block in siamlm.yaml configures steering for the whole world, self and others).
# Per agent: world.agent_providers=[{steer: {enabled: true}}, {}] steers agent 1 only.
steer:
  enabled: false
  concepts: [curiosity, introspection, emotion, confidence]   # Modulo starter vectors, extracted on first use
  vectors_dir: ${output.directory}/steer_vectors   # Modulo's registry layout: <vectors_dir>/<model slug>/registry.yaml
  layer: null          # null: the middle layer (where vectors are extracted)
  extract_questions: 20  # questions per prompt when a missing vector is extracted (Modulo's extract_vector)
  max_strength: 10     # |strength| is clamped to this; 15 = a push as large as the layer's typical activation norm
  decay: 0.85          # after each generation of the agent, every active strength is multiplied by this
  floor: 0.5           # a strength below this in size is removed
  max_active: 2        # vectors active at once (a call for one more is refused)
  control: real        # real | sham (nothing is added) | random (a fixed random direction of the same size);
                       # the model is told the same in every condition
