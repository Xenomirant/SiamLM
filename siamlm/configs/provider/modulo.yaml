# Local open-weight model that can steer its own activations (siamlm/providers/modulo.py; pip install "siamlm[steer]").
# Needs a Hugging Face causal LM with model.model.layers (Qwen/Llama/Mistral-style) whose chat template takes a system
# role. On CPU use a small model; Modulo extracts its starter vectors on first use (minutes on CPU), into vectors_dir.
name: modulo
model: Qwen/Qwen2.5-1.5B-Instruct
device: cpu
dtype: float32
vectors_dir: ${output.directory}/modulo_vectors
auto_extract: true
control: null            # null | real | sham | random | assign (Modulo's controlled-study conditions, disclosed)
menu_seed: null
include_community: false
temperature: 0.7
top_p: 0.9
timeout: 600
max_retries: 0
