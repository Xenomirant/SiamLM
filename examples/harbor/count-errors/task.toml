# A minimal Harbor-format task (harborframework.com task layout, schema 1.4) for SiamLM's Harbor adapter
# (siamlm/tasks/harbor.py). It needs no network: the image is built from a local base, and the test is plain bash.
schema_version = "1.4"

[task]
name = "siamlm/count-errors"
version = "1.0.0"
description = "Count the log lines that mention errors."
authors = []
keywords = ["shell", "example"]

[metadata]
difficulty = "easy"
category = "shell"
tags = ["example"]

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 512
